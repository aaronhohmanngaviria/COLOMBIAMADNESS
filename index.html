function eqBonuses(){
 let hp=0,arm=0,dmg=0,expPct=0,goldPct=0,rng=1,bow=false;
 if(!P||!P.eq)return{hp,arm,dmg,expPct,goldPct,rng,bow};
 for(const sl of Object.keys(P.eq)){
  const itEq=P.eq[sl];
  if(!itEq)continue;
  hp+=itEq.hp||0;
  arm+=itEq.arm||0;
  dmg+=itEq.dmg||0;
  expPct+=itEq.expPct||0;
  goldPct+=itEq.goldPct||0;
  if((itEq.rng||1)>rng)rng=itEq.rng||1;
  if(itEq.bow)bow=true;
 }
 return{hp,arm,dmg,expPct,goldPct,rng,bow};
}

/* ---- CÁLCULO CENTRAL DE LAS 5 ESTADÍSTICAS ---- */
function getStats(){
 const b=eqBonuses();
 return{
  dmg:1+(P.lvl>>1)+P.dmg+b.dmg,
  hp:P.hp,
  maxHp:P.max,
  expPct:100+(P.expBonus||0)+b.expPct,
  goldPct:100+(P.goldBonus||0)+b.goldPct,
  arm:P.arm+b.arm
 };
}
function getAtkReach(){
 const b=eqBonuses();
 const upReach=1+Math.floor((P.rng-1)/.5);
 return Math.max(upReach,b.rng);
}
function equipItem(item){
 const prev=P.eq[item.slot];
 P.eq[item.slot]=item;
 const b=eqBonuses();
 const targetMax=P.baseMax+b.hp;
 const diff=targetMax-P.max;
 P.max=targetMax;
 if(diff>0)P.hp=Math.min(P.max,P.hp+diff);
 else P.hp=Math.min(P.max,P.hp);
 if(prev){
  eqDrop.push({...prev,x:P.x+16,y:P.y+16});
 }
 pop(P.x-12,P.y-18,item.n,item.c);
 burst(P.x+16,P.y+16,20,item.c,170);
 snd(620,.18,'triangle');
}
function eqDesc(eq){
 const parts=[];
 if(eq.dmg)parts.push('+'+eq.dmg+' Daño');
 if(eq.hp)parts.push('+'+(eq.hp/2)+' ♥ Vida');
 if(eq.arm)parts.push('+'+eq.arm+' Armadura');
 if(eq.expPct)parts.push('+'+eq.expPct+'% EXP');
 if(eq.goldPct)parts.push('+'+eq.goldPct+'% Oro');
 if(eq.rng>1)parts.push('Alcance '+eq.rng);
 return parts.join(' · ')||'Equipo básico';
}

function pick(i){
 const u=P.ch[i];if(!u)return;u.f();pop(P.x-24,P.y-24,u.n,u.c);burst(P.x+16,P.y+16,24,u.c,200);snd(740,.2,'triangle');k.Space=k.KeyJ=k.Enter=0;S='play'
}
function upKey(c){
 const n=P.ch.length;
 if(c==='ArrowLeft'||c==='KeyA')P.sel=(P.sel+n-1)%n;
 else if(c==='ArrowRight'||c==='KeyD')P.sel=(P.sel+1)%n;
 else if(c==='Digit1'||c==='Digit2'||c==='Digit3')pick(+c.slice(5)-1);
 else if(c==='Enter'||c==='Space'||c==='KeyJ')pick(P.sel)
}

 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;

 if(solidT(tl(x,y)))return true;
 let x0=ox,y0=oy;
 const dx=Math.abs(x-x0),dy=Math.abs(y-y0);
 const sx=x0<x?1:-1,sy=y0<y?1:-1;
 let err=dx-dy;
 while(x0!==x||y0!==y){
  if((x0!==ox||y0!==oy)&&solidT(tl(x0,y0)))return true;
  const e2=2*err;
  if(e2>-dy){err-=dy;x0+=sx}
  if(e2<dx){err+=dx;y0+=sy}
 }
 return false;
}
function clipRays(ox,oy,tiles,e=null){
 const out=[];
 const bMinX=e&&e.boss?e.gx:ox,bMaxX=e&&e.boss?e.gx+1:ox;
 const bMinY=e&&e.boss?e.gy:oy,bMaxY=e&&e.boss?e.gy+1:oy;
 for(const[x,y]of tiles){
  if(x<0||y<0||x>=MW||y>=MH)continue;
  if(solidT(tl(x,y)))continue;
  const sx=x<bMinX?bMinX:x>bMaxX?bMaxX:Math.max(bMinX,Math.min(bMaxX,x));
  const sy=y<bMinY?bMinY:y>bMaxY?bMaxY:Math.max(bMinY,Math.min(bMaxY,y));
  if(blockedBySolid(sx,sy,x,y))continue;
  out.push([x,y]);
 }
 return out;
}
function tele(e,tiles,dm,mv,dur=1,arrow=null){
 if(e.atkCd>0)return;
 const ox=e.gx,oy=e.gy;
 let clampedMv=mv;
 if(mv){
  let maxSteps=0;
  for(let s=1;s<=mv[2];s++){
   const nx=e.gx+mv[0]*s,ny=e.gy+mv[1]*s;
   if(free2(e,nx,ny))maxSteps=s;
   else break;
  }
  clampedMv=[mv[0],mv[1],maxSteps];
 }
 e.tele={tiles:clipRays(ox,oy,tiles,e),dm,mv:clampedMv,dur,arrow};
 snd(150,.06,'square',.02)
}
function step(e){
 const dx=P.gx-e.gx,dy=P.gy-e.gy,c=[];
 if(dx)c.push([Math.sign(dx),0]);if(dy)c.push([0,Math.sign(dy)]);
 if(Math.abs(dy)>Math.abs(dx))c.reverse();
 for(const[mx,my]of c)if(free(e.gx+mx,e.gy+my,e)){e.gx+=mx;e.gy+=my;return true}
 const alt=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5),d0=cheb(e.gx,e.gy,P.gx,P.gy);
 for(const[mx,my]of alt)if(free(e.gx+mx,e.gy+my,e)&&cheb(e.gx+mx,e.gy+my,P.gx,P.gy)<=d0){e.gx+=mx;e.gy+=my;return true}
 return false
}
function bstep(e,tx,ty){
 const dx=tx-e.gx-.5,dy=ty-e.gy-.5,c=[];
 if(Math.abs(dx)>=.5)c.push([Math.sign(dx),0]);if(Math.abs(dy)>=.5)c.push([0,Math.sign(dy)]);
 if(Math.abs(dy)>Math.abs(dx))c.reverse();
 for(const[mx,my]of c)if(free2(e,e.gx+mx,e.gy+my)){e.gx+=mx;e.gy+=my;return}
}

 e.cd=(e.cd||0)+1;e.scd=(e.scd||0)+1;

/* ---------- helpers de UI ---------- */
function tx(s,x,y,c='#e6dec8',a='left',sz=15){
 ctx.font=`800 ${sz}px Cinzel,Georgia,serif`;ctx.textAlign=a;ctx.textBaseline='top';ctx.lineJoin='round';
 ctx.lineWidth=Math.max(3,sz/4);ctx.strokeStyle='#050308';ctx.strokeText(s,x,y);

function bevelBox(x,y,w,h,bg='#120d1a',brd='#8c6229',hi='#e6b85c'){
 x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
 ctx.fillStyle='rgba(3,2,6,0.85)';ctx.fillRect(x+3,y+3,w,h);
 ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);
 ctx.strokeStyle=brd;ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2);
 ctx.strokeStyle='#06040a';ctx.lineWidth=1;ctx.strokeRect(x+3.5,y+3.5,w-7,h-7);
 ctx.fillStyle=hi;
 ctx.fillRect(x,y,3,3);ctx.fillRect(x+w-3,y,3,3);ctx.fillRect(x,y+h-3,3,3);ctx.fillRect(x+w-3,y+h-3,3,3);
}
function heart(x,y,n){
 x=Math.round(x);y=Math.round(y);
 const mask=[
  '0011100011100',
  '0111110111110',
  '1111111111111',
  '1111111111111',
  '1111111111111',
  '0111111111110',
  '0011111111100',
  '0001111111000',
  '0000111110000',
  '0000011100000',
  '0000001000000'
 ];
 ctx.fillStyle='#06030a';
 for(let r=0;r<11;r++)for(let c=0;c<13;c++)if(mask[r][c]==='1')ctx.fillRect(x+c*2-1,y+r*2-1,4,4);
 for(let r=0;r<11;r++)for(let c=0;c<13;c++)if(mask[r][c]==='1'){
  ctx.fillStyle='#241320';ctx.fillRect(x+c*2,y+r*2,2,2);
  const full=n===2||(n===1&&c<7);
  if(full){
   ctx.fillStyle=r<3?'#ff5c74':r<7?'#c8192e':'#7a0b18';
   ctx.fillRect(x+c*2,y+r*2,2,2);
  }
 }
 if(n>0){ctx.fillStyle='#ffd6de';ctx.fillRect(x+4,y+4,2,2);ctx.fillRect(x+6,y+2,2,2)}
}

/* ═══════════════════════ 12b. OVERLAY DE TELEGRAFÍAS ═══════════════════ */
function drawArrow(a,p){
 const sxp=a.ox*T+16,syp=a.oy*T+16;
 const tipX=(a.ox+a.dx*a.n)*T+16,tipY=(a.oy+a.dy*a.n)*T+16;
 const ang=Math.atan2(a.dy,a.dx),len=Math.hypot(tipX-sxp,tipY-syp);
 ctx.save();ctx.translate(sxp,syp);ctx.rotate(ang);
 ctx.globalAlpha=.6+.4*Math.sin(t*10);
 ctx.strokeStyle='rgba(255,90,95,.35)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke();ctx.setLineDash([]);
 ctx.globalAlpha=1;
 const tip=len-6;
 ctx.fillStyle='#3a2410';ctx.fillRect(10,-1.5,tip-14,3);
 ctx.fillStyle='#8a5a30';ctx.fillRect(10,-1,tip-14,1);
 ctx.fillStyle='#e8d8a8';
 ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(2,-5);ctx.lineTo(5,0);ctx.lineTo(2,5);ctx.closePath();ctx.fill();
 ctx.fillStyle='#b8c4d8';
 ctx.beginPath();ctx.moveTo(tip+6,0);ctx.lineTo(tip,-4);ctx.lineTo(tip,4);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(tip+3,-1,2,2);
 ctx.restore();
}

    if(M.pp)for(const[x,y]of M.pp.slice(0,30)){ctx.fillStyle='rgba(230,184,92,.5)';ctx.fillRect(x*T+14,y*T+14,4,4)}}}

/* ---------- actualización de efectos ---------- */
function fxUpd(dt){
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;f.y-=34*dt;if(f.t<=0)fx.splice(i,1)}
 for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.vx*=.97;if(p.t<=0)pt.splice(i,1)}
 for(const a of amb){a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.y<-10)a.y=H+10;if(a.x<-10)a.x=W+10;if(a.x>W+10)a.x=-10}
}

function closeShop(){

function shopKey(c){
 const n=shopItems.length;
 if(c==='ArrowUp'||c==='KeyW')shopSel=(shopSel+n-1)%n;
 else if(c==='ArrowDown'||c==='KeyS')shopSel=(shopSel+1)%n;
 else if(c==='Enter'||c==='Space'||c==='KeyJ')buyShopItem(shopSel);
 else if(c==='Escape'||c==='KeyT')closeShop();
}
function shopClick(e){
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 shopItems.forEach((si,i)=>{const iy=84+i*50;if(x>=64&&x<=W-64&&y>=iy&&y<=iy+43){shopSel=i;buyShopItem(i)}});
 if(x>=W/2-95&&x<=W/2+95&&y>=H-54&&y<=H-28)closeShop();
}
function go(){
 if(S==='shop'||statsOpen)return;
 if(S==='title'||((S==='dead'||S==='won')&&deadT>.8)){reset();S='play'}
}
addEventListener('keydown',e=>{
 k[e.code]=1;
 if(S==='shop'){shopKey(e.code);e.preventDefault();return}
 if(S==='play'&&!e.repeat&&(e.code==='KeyC'||(statsOpen&&e.code==='Escape'))){statsOpen=!statsOpen;e.preventDefault();return}
 if(statsOpen){e.preventDefault();return}
 if(S==='play'&&!e.repeat&&(e.code==='Space'||e.code==='KeyJ'))P.want='atk';
 if(S==='up'){upKey(e.code);e.preventDefault()}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.code==='Enter'||e.code==='Space')go()
});
addEventListener('keyup',e=>k[e.code]=0);
addEventListener('blur',()=>{for(const c in k)k[c]=0});
function mpos(e){const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)/r.width*W;M.y=(e.clientY-r.top)/r.height*H;if(e.pointerType==='mouse')M.hv=true}

});
addEventListener('pointerup',()=>{M.down=M.rdown=false});

/* ═══════════════════════ 15. ARRANQUE (BLINDADO) ══════════════════════ */
try{
 reset();
}catch(err){
 console.error('FALLO EN reset():',err);
 document.body.insertAdjacentHTML('beforeend',
  '<pre style="position:fixed;left:8px;bottom:8px;max-width:92vw;color:#ff9090;'+
  'background:#180408;padding:10px;font:12px monospace;z-index:9999;white-space:pre-wrap;border:1px solid #a81c28">'+
  'ERROR AL INICIAR:\n'+(err&&err.stack?err.stack:err)+'</pre>');
}
let last=performance.now();
function loop(n){
 const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;
 try{
  if(S==='play'&&!tr)upd(dt);
  if(S==='dead'||S==='won')deadT+=dt;
  if(tr){tr.t+=dt;if(tr.t>=.4&&!tr.sw){tr.sw=true;snd(260,.3,'triangle');tr.dn?enter(LV+1,'up'):enter(LV-1,'dn')}if(tr.t>=.8)tr=null}
  fxUpd(dt);
  draw();
 }catch(err){
  console.error('FALLO EN loop():',err);
  S='dead';
 }
 requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
